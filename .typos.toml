[files]
extend-exclude = [
    ".git/",
    "node_modules/",
    "vendor/",
    "dist/",
    "build/",
    "tests/",
    "lang/",
]
ignore-hidden = false

[default]
extend-ignore-re = [
    "@[A-Za-z0-9_-]+",
    "Fabian Marz",
    "Tung Du",
    "Van Patten",
    "github:[^\"\\s]+",
]

[default.extend-words]
# Typos previously found in this codebase
"utilitary" = "utility"
"heirarchal" = "hierarchical"
"mimcs" = "mimics"
"santitize" = "sanitize"
"warnngs" = "warnings"
"versino" = "version"
"degister" = "deregister"
"quries" = "queries"
"supposably" = "supposably"
"stati" = "stati"

[default.extend-identifiers]
"Automattic" = "Automattic"
"avaiableServices" = "avaiableServices"
