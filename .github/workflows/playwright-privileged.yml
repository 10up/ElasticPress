# Privileged e2e: EP.io and @paidPlugins for pull requests that cannot
# receive repository secrets (forks).
#
# This workflow has access to secrets and checks out pull request code, then
# runs npm ci, the setup script, and Playwright. That is only safe after a
# maintainer has reviewed the commit being tested. Do not add unattended
# triggers (opened, synchronize, pull_request).
#
# Before applying safe-to-test or dispatching, review package.json scripts,
# bin/setup-e2e-env.sh, and tests/e2e. The label is removed on every new
# push so a later commit cannot reuse an earlier approval.
#
# Caches are restore-only. pull_request_target cannot write the default-branch
# cache; workflow_dispatch still can, so this job never saves after checking
# out pull request code. playwright.yml on push / same-repo pull_request
# populates the npm, composer, Playwright browser, and bin/.cache entries.
#
# Keep the remaining e2e job steps in sync with playwright.yml.

name: E2e Tests (privileged)

permissions:
  contents: read
  pull-requests: write

env:
  CI: true
  COMPOSER_VERSION: "2"
  COMPOSER_CACHE: "${{ github.workspace }}/.composer-cache"
  NODE_VERSION: "24"
  NODE_CACHE: "${{ github.workspace }}/node_modules_cache"

on:
  pull_request_target:
    types: [labeled, synchronize]
    branches:
      - develop
      - trunk
      - '[0-9].[0-9x]*'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to test
        required: true
        type: number

concurrency:
  group: privileged-e2e-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  revoke-safe-to-test:
    name: Remove safe-to-test on new commits
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      contains(github.event.pull_request.labels.*.name, 'safe-to-test')
    runs-on: ubuntu-latest
    steps:
    - name: Remove safe-to-test label
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh pr edit "${{ github.event.pull_request.number }}" --remove-label "safe-to-test" || true

  resolve-pr:
    name: Resolve pull request
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'safe-to-test'
      )
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      ref: ${{ steps.pr.outputs.ref }}
      sha: ${{ steps.pr.outputs.sha }}
      is_fork: ${{ steps.pr.outputs.is_fork }}
    steps:
    - name: Resolve pull request
      id: pr
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
      run: |
        if [ -z "$PR_NUMBER" ]; then
          echo "Missing pull request number"
          exit 1
        fi

        STATE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state)"
        if [ "$STATE" != "open" ]; then
          echo "Pull request #${PR_NUMBER} is not open"
          exit 1
        fi

        SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
        IS_FORK="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.repo.fork)"

        echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        echo "ref=refs/pull/${PR_NUMBER}/head" >> "$GITHUB_OUTPUT"
        echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
        echo "is_fork=${IS_FORK}" >> "$GITHUB_OUTPUT"

    - name: Link this run on the pull request
      if: github.event_name == 'workflow_dispatch'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ steps.pr.outputs.number }}
        SHA: ${{ steps.pr.outputs.sha }}
      run: |
        gh pr comment "$PR_NUMBER" --body "Privileged e2e (EP.io and @paidPlugins) started for \`${SHA}\`: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  e2e_local:
    name: ES ${{ matrix.esVersion }} - ${{ matrix.core.name }} (${{ matrix.testGroup }})
    needs: resolve-pr
    if: >
      needs.resolve-pr.result == 'success' &&
      (
        github.event_name == 'workflow_dispatch' ||
        needs.resolve-pr.outputs.is_fork == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.core.php }}
    strategy:
      fail-fast: false
      matrix:
        testGroup: ['@groups', '@paidPlugins']
        esVersion: ['7.10.1', '8.12.2', '9.1.5', 'EP.io']
        core:
          - {name: 'WP latest', version: '', wcVersion: '', php: '8.2'}
          - {name: 'WP minimum', version: '6.2', wcVersion: '6.4.0', php: '8.0'}
        exclude:
          - testGroup: '@groups'
            esVersion: '7.10.1'
          - testGroup: '@groups'
            esVersion: '8.12.2'
          - testGroup: '@groups'
            esVersion: '9.1.5'

    steps:
    # Checkout v7 blocks fork PR heads in pull_request_target unless this
    # opt-in is set. The checked-out code is executed on purpose after a
    # maintainer applies safe-to-test or dispatches this workflow.
    # codeql[actions/untrusted-checkout/critical]
    # codeql[actions/untrusted-checkout/high]
    - name: Checkout pull request
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve-pr.outputs.ref }}
        persist-credentials: false
        allow-unsafe-pr-checkout: true

    - name: Restore npm cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.NODE_CACHE }}
        key: npm-${{ env.NODE_VERSION }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          npm-${{ env.NODE_VERSION }}-
    - name: Restore composer cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.COMPOSER_CACHE }}
        key: composer-${{ env.COMPOSER_VERSION }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          composer-${{ env.COMPOSER_VERSION }}-

    - name: Set PHP version
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: :php-psr
        tools: cs2pr
        coverage: none

    - name: composer install
      run: composer install

    - name: "Install node v${{ env.NODE_VERSION }}"
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install dependencies
      run: npm ci --include=dev

    # Restore-only: playwright.yml is the trusted writer. Exact key only — a
    # restore-keys fallback would reuse browsers from a different Playwright
    # version. Chromium-only matches tests/e2e/src/playwright.config.ts.
    - name: Get Playwright version
      id: playwright
      run: echo "version=$(node -e "console.log(require('playwright-core/package.json').version)")" >> "$GITHUB_OUTPUT"
    - name: Restore Playwright browsers
      id: playwright-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Install Playwright OS dependencies
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Set up WP environment with Elasticsearch
      run: ES_VERSION=${{ matrix.esVersion }} npm run env:start
      if: matrix.esVersion != 'EP.io'

    - name: Set up WP environment with Elasticsearch (EP.io)
      run: |
        npm run env start
        npm run env:install-cli
      if: matrix.esVersion == 'EP.io'

    - name: Check ES response
      run: curl --connect-timeout 5 --max-time 10 --retry 5 --retry-max-time 40 --retry-all-errors http://localhost:8890
      if: matrix.esVersion != 'EP.io'

    - name: Build asset
      run: npm run build

    # Keyed on everything that shapes the database, so a change to the setup
    # script or the imported content produces a new cache rather than reusing a
    # stale one. The Elasticsearch version is deliberately absent: the backend is
    # configured through wp-config.php constants and the sync runs either way.
    - name: Restore database cache
      id: db-cache
      uses: actions/cache/restore@v4
      with:
        path: bin/.cache
        key: e2e-db-${{ matrix.core.version || 'latest' }}-${{ matrix.core.wcVersion || 'latest' }}-${{ matrix.core.php }}-${{ matrix.testGroup == '@paidPlugins' && 'acf' || 'noacf' }}-${{ hashFiles('bin/setup-e2e-env.sh', 'tests/e2e/src/wordpress-files/test-docs/content-example.xml') }}

    - name: Set up database
      run: |
        if [ "${{ matrix.testGroup }}" == "@paidPlugins" ]; then
          npm run e2e:setup -- --wp-version=${{ matrix.core.version }} --wc-version=${{ matrix.core.wcVersion }} --acf-pro-license='${{ secrets.ACF_PRO_LICENSE_KEY }}'
        else
          npm run e2e:setup -- --wp-version=${{ matrix.core.version }} --wc-version=${{ matrix.core.wcVersion }}
        fi
      if: matrix.esVersion != 'EP.io'

    - name: Set up database (EP.io)
      run: |
        if [ "${{ matrix.testGroup }}" == "@paidPlugins" ]; then
          npm run e2e:setup -- --ep-host=${{ secrets.EPIO_HOST }} --ep-credentials='${{ secrets.EPIO_CREDENTIALS }}' --ep-index-prefix=${{ secrets.EPIO_INDEX_PREFIX }} --wp-version=${{ matrix.core.version }} --wc-version=${{ matrix.core.wcVersion }} --acf-pro-license='${{ secrets.ACF_PRO_LICENSE_KEY }}'
        else
          npm run e2e:setup -- --ep-host=${{ secrets.EPIO_HOST }} --ep-credentials='${{ secrets.EPIO_CREDENTIALS }}' --ep-index-prefix=${{ secrets.EPIO_INDEX_PREFIX }} --wp-version=${{ matrix.core.version }} --wc-version=${{ matrix.core.wcVersion }}
        fi
      if: matrix.esVersion == 'EP.io'

    # Do not save caches from this workflow. workflow_dispatch still has
    # read-write access to the default-branch cache; playwright.yml is the
    # trusted writer for bin/.cache.

    # @groups is a matrix label, not a Playwright tag. group1 then group2 share
    # the environment; each invocation re-runs global setup. Later steps use
    # always() so cleanup still runs on failure.
    - name: Run @group1
      id: group1
      if: matrix.testGroup != '@paidPlugins'
      env:
        PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/playwright-report-group1
      run: npm run playwright:test -- --grep @group1 --output ${{ github.workspace }}/test-results-group1

    - name: Run @group2
      id: group2
      if: ${{ always() && !cancelled() && matrix.testGroup != '@paidPlugins' }}
      env:
        PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/playwright-report-group2
      run: npm run playwright:test -- --grep @group2 --output ${{ github.workspace }}/test-results-group2

    - name: Run @paidPlugins
      id: paid
      if: matrix.testGroup == '@paidPlugins'
      env:
        PLAYWRIGHT_HTML_OUTPUT_DIR: ${{ github.workspace }}/playwright-report-paidPlugins
      run: npm run playwright:test -- --grep @paidPlugins --output ${{ github.workspace }}/test-results-paidPlugins

    - name: Stop Elasticsearch
      if: ${{ always() && matrix.esVersion != 'EP.io' }}
      run: cd bin/es-docker/ && docker compose down

    - name: Delete Elasticsearch indices
      if: ${{ always() && matrix.esVersion == 'EP.io' }}
      run: |
        PLUGIN_NAME=$(basename "$PWD")
        ./bin/wp-env-cli wordpress "wp --allow-root plugin activate ${PLUGIN_NAME} --network"
        ./bin/wp-env-cli wordpress "wp --allow-root elasticpress-tests delete-all-indices"

    - name: Test plugin uninstall
      if: always()
      run: |
        PLUGIN_NAME=$(basename "$PWD")
        ! ./bin/wp-env-cli wordpress "wp --allow-root plugin deactivate ${PLUGIN_NAME} --network"
        ! ./bin/wp-env-cli wordpress "wp --allow-root plugin deactivate ${PLUGIN_NAME}"
        ./bin/wp-env-cli wordpress "cp -r wp-content/plugins/${PLUGIN_NAME} wp-content/plugins/ep-delete"
        ./bin/wp-env-cli wordpress "wp --allow-root plugin uninstall ep-delete"

    - name: Make artifacts available
      uses: actions/upload-artifact@v6
      if: ${{ failure() || cancelled() }}
      with:
        name: playwright-report-${{ matrix.esVersion }}-${{ matrix.core.name }}-${{ matrix.testGroup }}
        retention-days: 2
        if-no-files-found: ignore
        path: |
          playwright-report-group1/
          playwright-report-group2/
          playwright-report-paidPlugins/
          test-results-group1/
          test-results-group2/
          test-results-paidPlugins/
